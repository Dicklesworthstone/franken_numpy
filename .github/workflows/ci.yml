name: CI Gate Topology

# main is the canonical branch; master is a passive mirror (per AGENTS.md
# RULE 0). CI runs on main only; the mirror push from main updates master
# without re-triggering CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A push to main gets its OWN concurrency group, keyed by commit SHA, and is
# never cancelled. `cancel-in-progress: false` on a shared group is NOT enough:
# GitHub cancels the previously *pending* run of a group when a new one queues,
# so with one group per ref the intermediate commits stay unverified whenever the
# swarm pushes faster than the gate topology takes (~8-12 min). That is exactly
# what deadlock-audit-5g1ag measured — 59 of 60 consecutive runs on main were
# `cancelled`, none reached a verdict in over twelve hours, and four hard clippy
# errors rode along under commits whose messages said "verified". Per-SHA groups
# make every commit on main get its own verdict.
#
# Pull-request runs keep the classic supersede-the-stale-run behaviour: there
# only the head commit is being reviewed, so cancelling an obsolete run is right.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'head' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Pin numpy's BLAS to a single thread. The native f64 GEMM / linalg fast paths
  # only engage (and only beat numpy) when BLAS is serial — blas_is_single_threaded()
  # gates on these vars — so several fnp-python tests that assert the native path
  # engages require them; it also stops multi-threaded-BLAS contention from faking
  # perf gaps on the runner.
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  # RUSTFLAGS env REPLACES .cargo/config.toml's rustflags entirely, so the
  # project's +avx2 ISA baseline must be restated here or CI builds a binary
  # that violates the contract worker_isa_probe asserts (avx2 baked in, fma
  # NOT baked in). All GitHub-hosted x86_64 runners support AVX2.
  RUSTFLAGS: "-D warnings -C target-feature=+avx2"
  RUST_TOOLCHAIN: nightly-2026-08-25
  PHASE2C_PACKETS: "FNP-P2C-001 FNP-P2C-002 FNP-P2C-003 FNP-P2C-004 FNP-P2C-005 FNP-P2C-006 FNP-P2C-007 FNP-P2C-008 FNP-P2C-009"

jobs:
  g1-fmt-lint:
    name: "G1: fmt + lint"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  g9-wheel:
    # Packaging is a deliverable (README Installation, Roadmap item 1): build the
    # wheel with maturin from pyproject.toml, install it into a clean interpreter and
    # check that the installed package exposes the WHOLE extension namespace. The
    # namespace assertion exists because maturin's default wrapper silently dropped
    # 247 names (Nditer, __version__, ...) on 2026-09-03; python/fnp_python/__init__.py
    # is the fix and this job is its gate. Runs off G1 so a red G2-G8 does not hide it.
    name: "G9: wheel builds and imports"
    needs: g1-fmt-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip maturin
      - run: maturin build --release --out dist
      - run: python -m pip install dist/*.whl
      - run: |
          cd /tmp
          python - <<'PY'
          import fnp_python as pkg
          import fnp_python.fnp_python as ext
          import fnp_python.linalg as la
          import numpy as np
          missing = sorted(n for n in dir(ext) if not hasattr(pkg, n))
          assert not missing, f"{len(missing)} extension names missing from the package: {missing[:10]}"
          assert la is pkg.linalg, "dotted submodule import does not resolve to the package attribute"
          assert pkg.__version__ and pkg.__numpy_version__ == np.__version__
          assert (pkg.random.default_rng(12345).standard_normal(3) == np.random.default_rng(12345).standard_normal(3)).all()
          assert isinstance(pkg.allclose(np.arange(3.0), np.arange(3.0)), bool)
          print("wheel ok:", pkg.__version__, "numpy", np.__version__)
          PY

  g2-unit-property:
    name: "G2: unit + property"
    needs: g1-fmt-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      # `cargo test --workspace` runs the fnp-conformance oracle/differential
      # suites, which import a live numpy (diagnostic_oracle, dtype_shape_diagnostics,
      # and the fft/polynomial/signal differential comparisons). Without numpy they
      # fail with numpy_unavailable, so G2 needs the same interpreter G3 sets up.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "numpy<2.5"
      # crates/fnp-conformance/tests/codebase_hygiene.rs shells out to ripgrep
      # (rg) to enforce the no-stubs / no-unsafe invariants; the runner image
      # does not ship it, so without this those 11 tests panic "rg should be
      # available" and G2 can never pass.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  g3-differential:
    name: "G3: differential"
    needs: g2-unit-property
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FNP_REQUIRE_REAL_NUMPY_ORACLE: "1"
      FNP_ORACLE_PYTHON: "python3"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "numpy<2.5"
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p fnp-conformance --bin capture_numpy_oracle
      - name: Verify oracle uses real NumPy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          oracle_path = Path("crates/fnp-conformance/fixtures/oracle_outputs/ufunc_oracle_output.json")
          payload = json.loads(oracle_path.read_text(encoding="utf-8"))
          source = payload.get("oracle_source", "")
          if source == "pure_python_fallback":
              raise SystemExit(
                  "G3 failure: oracle capture used pure_python_fallback; configure NumPy-backed FNP_ORACLE_PYTHON"
              )
          print(f"G3 oracle_source={source}")
          PY
      - run: cargo run -p fnp-conformance --bin run_ufunc_differential

  g4-adversarial-security:
    name: "G4: adversarial + security"
    needs: g3-differential
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/e2e/run_security_policy_gate.sh

  g5-test-contract:
    name: "G5: test contract"
    needs: g4-adversarial-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/e2e/run_test_contract_gate.sh

  g6-workflow-forensics:
    name: "G6: workflow + forensics"
    needs: g5-test-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - env:
          FNP_WORKFLOW_RETRIES: "0"
          FNP_WORKFLOW_FLAKE_BUDGET: "0"
          FNP_WORKFLOW_COVERAGE_FLOOR: "1.0"
        run: bash scripts/e2e/run_workflow_scenario_gate.sh

  g7-performance-budget:
    name: "G7: performance budget"
    needs: g6-workflow-forensics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - env:
          FNP_PERF_CANDIDATE_BASELINE: /tmp/perf_candidate.json
          FNP_PERF_MAX_P99_REGRESSION_RATIO: "0.07"
          FNP_PERF_COVERAGE_FLOOR: "1.0"
        run: bash scripts/e2e/run_performance_budget_gate.sh

  g8-durability-decode:
    name: "G8: durability + decode proof"
    needs: g7-performance-budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo run -p fnp-conformance --bin run_raptorq_gate --
          --retries 1 --flake-budget 0 --coverage-floor 1.0
      - name: Validate Phase2C packet readiness
        run: |
          for packet in $PHASE2C_PACKETS; do
            cargo run -p fnp-conformance --bin validate_phase2c_packet -- --packet-id "$packet"
          done
